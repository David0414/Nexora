<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/dm-icon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/images/dm-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/dm-apple-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090b" />
    <script>
      (() => {
        let theme = "dark";
        try {
          if (localStorage.getItem("portfolio-theme") === "light") theme = "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#e9e7de" : "#08090b";
      })();
    </script>
    <meta name="description" content="David Mendoza — Full-stack developer in Mexico. Websites, SEO, backend platforms and automation. Explore my projects and get in touch." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>David Mendoza — Full-stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
